<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Interview Question Generator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
            padding-top: 2rem;
        }
        .upload-container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 2rem;
            margin-bottom: 2rem;
        }
        .results-container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            padding: 2rem;
            min-height: 400px;
        }
        .upload-area {
            border: 2px dashed #6c757d;
            border-radius: 5px;
            padding: 3rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .upload-area:hover {
            border-color: #007bff;
            background-color: #f1f8ff;
        }
        .question-card {
            margin-bottom: 1rem;
            border-left: 4px solid #007bff;
        }
        .answer-card {
            margin-bottom: 2rem;
            border-left: 4px solid #28a745;
        }
        .loading {
            display: none;
            text-align: center;
            padding: 2rem;
        }
        .spinner-border {
            width: 3rem;
            height: 3rem;
        }
        #analyzeBtn {
            display: none;
        }
        .card-text {
            white-space: pre-line;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row mb-4">
            <div class="col-12 text-center">
                <h1>PDF Interview Question Generator</h1>
                <p class="lead">Upload a PDF to generate interview questions and answers</p>
            </div>
        </div>

        <div class="row">
            <div class="col-md-12">
                <div class="upload-container">
                    <h3 class="mb-3">Upload PDF Document</h3>
                    <form id="uploadForm" enctype="multipart/form-data">
                        <div class="upload-area" id="uploadArea">
                            <img src="/static/pdf-icon.svg" alt="PDF Icon" width="64" class="mb-3" onerror="this.src='https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/icons/file-earmark-pdf.svg'">
                            <h4>Drag & Drop PDF file here</h4>
                            <p>or</p>
                            <input type="file" id="pdfFile" name="file" accept=".pdf" class="d-none">
                            <button type="button" class="btn btn-primary" id="browseBtn">Browse Files</button>
                        </div>
                        <div class="d-grid mt-3">
                            <button type="submit" class="btn btn-success" id="uploadBtn">Upload PDF</button>
                            <button type="button" class="btn btn-success mt-2" id="analyzeBtn">Generate Interview Questions</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <div class="row">
            <div class="col-md-12">
                <div class="results-container">
                    <h3 class="mb-4">Generated Questions & Answers</h3>

                    <div class="loading" id="loadingIndicator">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <p class="mt-3" id="loadingText">Processing your PDF...</p>
                    </div>

                    <div id="resultsArea">
                        <!-- Results will be displayed here -->
                        <div class="alert alert-info">
                            Upload a PDF to see generated questions and answers
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.0/papaparse.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const uploadArea = document.getElementById('uploadArea');
            const fileInput = document.getElementById('pdfFile');
            const browseBtn = document.getElementById('browseBtn');
            const uploadForm = document.getElementById('uploadForm');
            const uploadBtn = document.getElementById('uploadBtn');
            const analyzeBtn = document.getElementById('analyzeBtn');
            const loadingIndicator = document.getElementById('loadingIndicator');
            const loadingText = document.getElementById('loadingText');
            const resultsArea = document.getElementById('resultsArea');

            let uploadedPdfFilename = null;

            // Handle file browsing
            browseBtn.addEventListener('click', function() {
                fileInput.click();
            });

            // Display file name when selected
            fileInput.addEventListener('change', function() {
                if (this.files.length > 0) {
                    const fileName = this.files[0].name;
                    uploadArea.querySelector('h4').textContent = `Selected file: ${fileName}`;
                }
            });

            // Handle drag and drop
            uploadArea.addEventListener('dragover', function(e) {
                e.preventDefault();
                uploadArea.classList.add('bg-light');
            });

            uploadArea.addEventListener('dragleave', function() {
                uploadArea.classList.remove('bg-light');
            });

            uploadArea.addEventListener('drop', function(e) {
                e.preventDefault();
                uploadArea.classList.remove('bg-light');

                if (e.dataTransfer.files.length > 0) {
                    const file = e.dataTransfer.files[0];
                    if (file.type === 'application/pdf') {
                        fileInput.files = e.dataTransfer.files;
                        uploadArea.querySelector('h4').textContent = `Selected file: ${file.name}`;
                    } else {
                        alert('Please upload a PDF file');
                    }
                }
            });

            // Handle form submission for upload
            uploadForm.addEventListener('submit', function(e) {
                e.preventDefault();

                if (!fileInput.files.length) {
                    alert('Please select a PDF file first');
                    return;
                }

                // Create FormData object
                const formData = new FormData();
                formData.append('pdf_file', fileInput.files[0]);
                formData.append('filename', fileInput.files[0].name);

                // Show loading indicator
                loadingIndicator.style.display = 'block';
                loadingText.textContent = 'Uploading your PDF...';
                resultsArea.innerHTML = '';
                uploadBtn.disabled = true;

                // Send request to server
                fetch('/upload', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    // Parse the JSON string in the response if needed
                    const parsedData = typeof data === 'string' ? JSON.parse(data) : data;

                    // Hide loading indicator
                    loadingIndicator.style.display = 'none';
                    uploadBtn.disabled = false;

                    if (parsedData.msg === 'success') {
                        // Store the uploaded PDF filename
                        uploadedPdfFilename = parsedData.pdf_filename;

                        // Show the analyze button
                        analyzeBtn.style.display = 'block';

                        // Show success message
                        resultsArea.innerHTML = '<div class="alert alert-success">PDF uploaded successfully! Click "Generate Interview Questions" to process it.</div>';
                    } else {
                        resultsArea.innerHTML = '<div class="alert alert-danger">Failed to upload PDF. Please try again.</div>';
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    loadingIndicator.style.display = 'none';
                    uploadBtn.disabled = false;
                    resultsArea.innerHTML = '<div class="alert alert-danger">An error occurred while uploading your PDF. Please try again.</div>';
                });
            });

            // Handle analyze button click
            analyzeBtn.addEventListener('click', function() {
                if (!uploadedPdfFilename) {
                    alert('Please upload a PDF file first');
                    return;
                }

                // Show loading indicator
                loadingIndicator.style.display = 'block';
                loadingText.textContent = 'Generating interview questions and answers...';
                resultsArea.innerHTML = '';
                analyzeBtn.disabled = true;

                // Create FormData object
                const formData = new FormData();
                formData.append('pdf_filename', uploadedPdfFilename);

                // Send request to server
                fetch('/analyze', {
                    method: 'POST',
                    body: formData
                })
                .then(response => response.json())
                .then(data => {
                    // Hide loading indicator
                    loadingIndicator.style.display = 'none';
                    analyzeBtn.disabled = false;

                    if (data.output_file) {
                        // Load and display the CSV file
                        loadCsvResults(data.output_file);
                    } else {
                        resultsArea.innerHTML = '<div class="alert alert-warning">No questions could be generated. Try uploading a different PDF.</div>';
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    loadingIndicator.style.display = 'none';
                    analyzeBtn.disabled = false;
                    resultsArea.innerHTML = '<div class="alert alert-danger">An error occurred while generating questions. Please try again.</div>';
                });
            });

            // Function to load and display CSV results
            function loadCsvResults(csvFilePath) {
                // Show loading indicator for CSV parsing
                loadingIndicator.style.display = 'block';
                loadingText.textContent = 'Loading results...';

                fetch(csvFilePath)
                    .then(response => response.text())
                    .then(csvData => {
                        Papa.parse(csvData, {
                            header: true,
                            skipEmptyLines: true,
                            complete: function(results) {
                                // Hide loading indicator
                                loadingIndicator.style.display = 'none';

                                if (results.data && results.data.length > 0) {
                                    let resultsHTML = '';

                                    results.data.forEach((item, index) => {
                                        // Skip empty rows
                                        if (!item.Question && !item.Answer) return;

                                        const questionNum = index + 1;
                                        const questionText = item.Question || '';
                                        const answerText = item.Answer || '';

                                        resultsHTML += `
                                            <div class="card question-card">
                                                <div class="card-body">
                                                    <h5 class="card-title">Question ${questionNum}</h5>
                                                    <p class="card-text">${questionText}</p>
                                                </div>
                                            </div>

                                            <div class="card answer-card">
                                                <div class="card-body">
                                                    <h6 class="card-subtitle mb-2 text-muted">Answer:</h6>
                                                    <p class="card-text">${answerText}</p>
                                                </div>
                                            </div>
                                        `;
                                    });

                                    if (resultsHTML) {
                                        resultsArea.innerHTML = resultsHTML;
                                    } else {
                                        resultsArea.innerHTML = '<div class="alert alert-warning">No valid questions and answers found in the CSV file.</div>';
                                    }
                                } else {
                                    resultsArea.innerHTML = '<div class="alert alert-warning">No questions could be generated. Try uploading a different PDF.</div>';
                                }
                            },
                            error: function(error) {
                                console.error('CSV Parsing Error:', error);
                                loadingIndicator.style.display = 'none';
                                resultsArea.innerHTML = '<div class="alert alert-danger">An error occurred while parsing the results. Please try again.</div>';
                            }
                        });
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        loadingIndicator.style.display = 'none';
                        resultsArea.innerHTML = '<div class="alert alert-danger">An error occurred while loading the results. Please try again.</div>';
                    });
            }
        });
    </script>
</body>
</html>
